services:
  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr-swarm_bazarr
    environment:
    - PUID=1000
    - PGID=33
    - TZ=America/Chicago
    volumes:
    - /media/Multimedia/Movies:/movies
    - /media/Multimedia/TV Series:/tv
    - /var/lib/docker/volumes/bazarr-swarm:/config
    ports:
    - target: 6767
      published: 6767
      protocol: tcp
      mode: host
    deploy:
      placement:
        constraints:
        - node.labels.deployment.target.bazarr == true
      restart_policy:
        condition: on-failure
volumes: {}
