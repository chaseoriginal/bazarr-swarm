---
services:
  bazarr:
    image: ${image}
    container_name: ${container_name}
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - /media/Multimedia/Movies:/movies
      - /media/Multimedia/TV Series:/tv
      - /var/lib/docker/volumes/${container_name}:/config

    ports:
      - target: 6767
        published: 6767
        protocol: tcp
        mode: host        
    deploy:
      placement:
        constraints:
          - node.labels.deployment.target.bazarr == true
      restart_policy:
        condition: on-failure